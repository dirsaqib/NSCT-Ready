<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSCT Lab Test</title>
<style>
:root{--brand:#0B6E4F;--ink:#1B2420;--muted:#5E6B64;--line:#E2E8E3;--bg:#F4F6F5;--bad:#C0392B;--accent:#E9A23B}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg);user-select:none}
.wrap{max-width:1180px;margin:0 auto;padding:20px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
h1{margin:0 0 6px;font-size:24px}.muted{color:var(--muted)}.small{font-size:13px}
input,textarea{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px;width:100%}textarea{user-select:text;font-family:Consolas,monospace;min-height:220px}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:10px 16px;background:var(--brand);color:#fff;cursor:pointer}.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.acc{background:var(--accent);color:#1B2420}
.bar{position:sticky;top:0;z-index:5;background:#0B3B2C;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:12px 20px}
.timer{font:700 22px Consolas,monospace;background:rgba(255,255,255,.12);padding:4px 12px;border-radius:8px}.timer.low{background:var(--bad)}
.grid{display:grid;grid-template-columns:1fr 290px;gap:16px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer;font:inherit}
.opt.sel{border-color:var(--brand);background:#E7F4EE}.opt .l{min-width:28px;height:28px;border-radius:6px;background:#EEF1EF;display:grid;place-items:center;font-weight:700}.opt.sel .l{background:var(--brand);color:#fff}
pre{background:#0F1A16;color:#E8F2EC;padding:12px;border-radius:8px;overflow:auto}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.pal button{font:inherit;padding:8px 0;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer}
.pal .a{background:var(--brand);color:#fff;border-color:var(--brand)}.pal .f{box-shadow:inset 0 0 0 2px var(--accent)}.pal .c{outline:2px solid var(--ink)}
.notice{padding:10px 14px;border-radius:8px;background:#FFF5E5;border:1px solid #F3D9A6;margin-bottom:12px}.notice.bad{background:#FBEBEB;border-color:#F2C0BB}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
#wm{position:fixed;inset:0;pointer-events:none;opacity:.05;font-size:14px;line-height:70px;transform:rotate(-24deg) scale(1.4);overflow:hidden;z-index:3}#wm span{display:inline-block;margin:0 60px;white-space:nowrap}
table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--line);padding:6px;text-align:left}
</style>
</head>
<body>
<div id="app"></div>
<div id="wm"></div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let token = sessionStorage.getItem("nsct-token");
let E = null, idx = 0, dirty = false, tabs = 0, fsExits = 0, skew = 0, qStart = Date.now();
const KEY = () => "nsct-lab-" + (E ? E.roll : "");

async function call(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json", "X-Session": token || "" }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || "Error"); e.status = r.status; throw e; }
  return d;
}

function login(msg) {
  document.body.style.userSelect = "auto";
  $("#app").innerHTML = `<div class="wrap" style="max-width:460px;margin-top:8vh"><div class="card">
    <h1>NSCT Lab Test</h1><p class="muted">Sign in with your roll number and the room code on the board.</p>
    ${msg ? `<div class="notice bad">${esc(msg)}</div>` : ""}
    <form id="lf"><p><label>Roll number<input name="roll" required autocomplete="off" autofocus></label></p>
    <p><label>Room code<input name="code" required autocomplete="off" style="text-transform:uppercase;letter-spacing:3px;font-family:Consolas,monospace"></label></p>
    <p><label>Seat or PC number (optional)<input name="seat" autocomplete="off"></label></p>
    <button class="btn" style="width:100%">Start</button></form>
    <p class="small muted">Keep this window in full screen. Leaving it is recorded.</p></div></div>`;
  $("#lf").onsubmit = async (e) => {
    e.preventDefault(); const f = new FormData(e.target);
    try { const r = await call("/api/login", { roll: f.get("roll"), code: f.get("code"), seat: f.get("seat") }); token = r.token; sessionStorage.setItem("nsct-token", token); goFull(); load(); }
    catch (er) { login(er.message); }
  };
}

function goFull() { try { document.documentElement.requestFullscreen && document.documentElement.requestFullscreen().catch(() => {}); } catch (e) {} }

async function load() {
  try { E = await call("/api/exam"); } catch (e) { token = null; sessionStorage.removeItem("nsct-token"); return login(e.message); }
  skew = E.serverNow - Date.now();
  // Merge anything saved on this PC that the server has not seen yet.
  try { const local = JSON.parse(localStorage.getItem(KEY()) || "null"); if (local) for (const it of E.items) { const l = local[it.id]; if (l) { it.selected = l.selected; it.codeAnswer = l.code; it.flagged = l.flagged; } } } catch (e) {}
  if (E.submitted) return done();
  document.getElementById("wm").innerHTML = Array(40).fill(`<span>${esc(E.name)} · ${esc(E.roll)}</span>`).join("");
  render();
}

const answered = (it) => it.type === "CODE" ? !!(it.codeAnswer || "").trim() && it.codeAnswer !== it.starterCode : it.selected.length > 0;

function render() {
  const it = E.items[idx], L = "ABCDEF";
  const n = E.items.filter(answered).length;
  $("#app").innerHTML = `<div class="bar"><div><b>${esc(E.title)}</b> <span class="small" style="opacity:.75">· ${esc(E.name)} (${esc(E.roll)}) · ${n}/${E.items.length} answered</span></div>
    <div class="row"><span class="small" id="sv" style="opacity:.7"></span><span class="timer" id="tm"></span><button class="btn acc" id="sub">Submit</button></div></div>
  <div class="wrap">${document.fullscreenElement ? "" : `<div class="notice">Please return to full screen. <button class="btn sec" id="fs">Full screen</button></div>`}
  <div class="grid"><div class="card">
    <div class="small muted">Question ${idx + 1} of ${E.items.length} · ${esc(it.subject)}${it.multi ? " · select all that apply" : ""}</div>
    ${it.scenario ? `<div class="notice" style="background:#EEF6F2;border-color:#CBE5D9"><b>${esc(it.scenario.title)}</b><div class="small" style="white-space:pre-wrap">${esc(it.scenario.passage)}</div></div>` : ""}
    <h2 style="font-size:18px;white-space:pre-wrap">${esc(it.text)}</h2>${it.code ? `<pre>${esc(it.code)}</pre>` : ""}
    ${it.type === "CODE" ? `<p class="small muted">Read input with <code>require("fs").readFileSync(0, "utf8")</code> and print the answer with <code>console.log</code>.</p>
      <textarea id="code" spellcheck="false">${esc(it.codeAnswer ?? it.starterCode ?? "")}</textarea>
      <div class="row" style="margin-top:8px"><button class="btn sec" id="run">Run sample tests</button></div><div id="out"></div>`
      : it.options.map((o, i) => `<button class="opt ${it.selected.includes(i) ? "sel" : ""}" data-i="${i}"><span class="l">${it.multi ? (it.selected.includes(i) ? "&#9745;" : "&#9744;") : L[i]}</span><span>${esc(o)}</span></button>`).join("")}
    <div class="row between" style="margin-top:16px"><div class="row"><button class="btn sec" id="prev" ${idx === 0 ? "disabled" : ""}>Previous</button><button class="btn sec" id="flag">${it.flagged ? "Unflag" : "Flag for review"}</button></div>
    <button class="btn" id="next">${idx === E.items.length - 1 ? "Review and submit" : "Next"}</button></div>
  </div>
  <div class="card"><b>Questions</b><div class="pal" style="margin-top:10px">${E.items.map((x, i) => `<button data-q="${i}" class="${answered(x) ? "a" : ""} ${x.flagged ? "f" : ""} ${i === idx ? "c" : ""}">${i + 1}</button>`).join("")}</div>
  <p class="small muted">Recorded: ${tabs} times left the window, ${fsExits} full-screen exits. Answers save every few seconds.</p></div></div></div>`;
  document.querySelectorAll(".opt").forEach((b) => b.onclick = () => { const i = +b.dataset.i; if (it.multi) it.selected = it.selected.includes(i) ? it.selected.filter((x) => x !== i) : it.selected.concat(i); else it.selected = [i]; touch(); render(); });
  document.querySelectorAll("[data-q]").forEach((b) => b.onclick = () => move(+b.dataset.q));
  const c = $("#code"); if (c) { c.oninput = () => { it.codeAnswer = c.value; touch(); }; c.onkeydown = (e) => { if (e.key === "Tab") { e.preventDefault(); const s = c.selectionStart; c.value = c.value.slice(0, s) + "  " + c.value.slice(c.selectionEnd); c.selectionStart = c.selectionEnd = s + 2; it.codeAnswer = c.value; touch(); } }; }
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on("prev", () => move(idx - 1)); on("next", () => idx === E.items.length - 1 ? confirmSubmit() : move(idx + 1));
  on("flag", () => { it.flagged = !it.flagged; touch(); render(); }); on("sub", confirmSubmit); on("fs", goFull);
  on("run", async () => { try { const r = await call("/api/run", { id: it.id, code: $("#code").value }); $("#out").innerHTML = `<table><tr><th>Input</th><th>Expected</th><th>Your output</th><th></th></tr>${r.rows.map((x) => `<tr><td>${esc(x.input)}</td><td>${esc(x.expected)}</td><td>${esc(x.got)}</td><td>${x.ok ? "pass" : "<b style='color:var(--bad)'>fail</b>"}</td></tr>`).join("")}</table>`; } catch (e) { $("#out").textContent = e.message; } });
  tick();
}
function move(i) { E.items[idx].timeSec = (E.items[idx].timeSec || 0) + (Date.now() - qStart) / 1000; qStart = Date.now(); idx = Math.max(0, Math.min(E.items.length - 1, i)); render(); }
function touch() {
  dirty = true;
  try { localStorage.setItem(KEY(), JSON.stringify(Object.fromEntries(E.items.map((x) => [x.id, { selected: x.selected, code: x.codeAnswer, flagged: x.flagged }])))); } catch (e) {}
}
async function sync() {
  if (!E || E.submitted || !dirty) return;
  try {
    await call("/api/save", { answers: E.items.map((x) => ({ id: x.id, selected: x.selected, code: x.codeAnswer, flagged: x.flagged, timeSec: x.timeSec || 0 })), tabSwitches: tabs, fullscreenExits: fsExits });
    dirty = false; const s = $("#sv"); if (s) s.textContent = "Saved " + new Date().toLocaleTimeString();
  } catch (e) {
    if (e.status === 409) { E.submitted = true; done(e.message); } else if (e.status === 401) { login(e.message); }
    else { const s = $("#sv"); if (s) s.textContent = "Not saved, retrying"; }
  }
}
function tick() {
  const t = $("#tm"); if (!t || !E) return;
  const left = Math.max(0, Math.round((E.endsAt - (Date.now() + skew)) / 1000));
  t.textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
  t.classList.toggle("low", left < 300);
  if (left === 0 && !E.submitted) submit(true);
}
async function confirmSubmit() {
  const un = E.items.filter((x) => !answered(x)).length;
  if (confirm(`Submit your test? ${un} unanswered. You cannot change answers after this.`)) submit(false);
}
async function submit(auto) {
  dirty = true; await sync();
  try { await call("/api/submit", {}); } catch (e) {}
  E.submitted = true; try { localStorage.removeItem(KEY()); } catch (e) {}
  sessionStorage.removeItem("nsct-token"); done(auto ? "Time is up. Your test was submitted." : "");
}
function done(msg) {
  document.getElementById("wm").innerHTML = "";
  $("#app").innerHTML = `<div class="wrap" style="max-width:520px;margin-top:10vh"><div class="card" style="text-align:center"><h1>Test submitted</h1>${msg ? `<p>${esc(msg)}</p>` : ""}<p class="muted">Your answers are saved on the lab server. Your department will release the results on NSCT Ready.</p></div></div>`;
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
}

setInterval(tick, 1000);
setInterval(sync, 5000);
document.addEventListener("visibilitychange", () => { if (document.hidden && E && !E.submitted) { tabs++; dirty = true; } });
window.addEventListener("blur", () => { if (E && !E.submitted) { dirty = true; } });
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && E && !E.submitted) { fsExits++; dirty = true; render(); } });
["copy", "cut", "paste", "contextmenu"].forEach((ev) => document.addEventListener(ev, (e) => { if (E && !E.submitted) e.preventDefault(); }));
window.addEventListener("beforeunload", (e) => { if (E && !E.submitted) { sync(); e.preventDefault(); e.returnValue = ""; } });
token ? load() : login();
</script>
</body>
</html>
