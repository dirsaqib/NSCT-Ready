<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSCT Lab Server: Invigilator</title>
<style>
:root{--brand:#0B6E4F;--ink:#1B2420;--muted:#5E6B64;--line:#E2E8E3;--bg:#F4F6F5;--bad:#C0392B;--accent:#E9A23B}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,Arial,sans-serif;color:var(--ink);background:var(--bg)}
.wrap{max-width:1200px;margin:0 auto;padding:20px}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
h1{margin:0 0 4px;font-size:24px}.muted{color:var(--muted)}.small{font-size:13px}
input{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:8px}
.btn{font:inherit;font-weight:600;border:0;border-radius:8px;padding:9px 14px;background:var(--brand);color:#fff;cursor:pointer}.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.acc{background:var(--accent);color:#1B2420}.btn.red{background:var(--bad)}.btn.sm{padding:5px 10px;font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px}.stat b{font-size:26px;display:block}
table{border-collapse:collapse;width:100%;font-size:14px}td,th{border-bottom:1px solid var(--line);padding:8px;text-align:left}th{font-size:12px;text-transform:uppercase;color:var(--muted)}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600;background:#E7F4EE;color:var(--brand)}.pill.warn{background:#FFF1D6;color:#8A5A00}.pill.bad{background:#FBEBEB;color:var(--bad)}.pill.grey{background:#EEF1EF;color:var(--muted)}
.code{font:800 64px Consolas,monospace;letter-spacing:10px}
.notice{padding:10px 14px;border-radius:8px;background:#FBEBEB;border:1px solid #F2C0BB;margin-bottom:12px}
#big{position:fixed;inset:0;background:#0B3B2C;color:#fff;display:none;place-items:center;text-align:center;z-index:9;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div><div id="big"></div>
<script>
"use strict";
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let token = sessionStorage.getItem("nsct-admin"), timer = null, filter = "";
async function call(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json", "X-Admin": token || "" }, body: body ? JSON.stringify(body) : undefined });
  if (path === "/api/admin/export" && r.ok) return r;
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(d.error || "Error"); e.status = r.status; throw e; }
  return d;
}
function signin(msg) {
  clearInterval(timer);
  $("#app").innerHTML = `<div class="wrap" style="max-width:560px;margin-top:6vh"><div class="card"><h1>NSCT Lab Server</h1>
  <p class="muted">Load the test package you downloaded from NSCT Ready, then type its passphrase. After a restart, only the passphrase is needed.</p>
  ${msg ? `<div class="notice">${esc(msg)}</div>` : ""}
  <form id="f"><p><label>Package file (.nsctlab)<br><input type="file" id="file" accept=".nsctlab,.json"></label></p>
  <p><label>Passphrase<br><input type="password" id="pass" required style="width:100%" autocomplete="off"></label></p>
  <button class="btn">Open test</button></form></div></div>`;
  $("#f").onsubmit = async (e) => {
    e.preventDefault();
    const fl = $("#file").files[0];
    try { const r = await call("/api/admin/load", { file: fl ? await fl.text() : undefined, passphrase: $("#pass").value }); token = r.token; sessionStorage.setItem("nsct-admin", token); start(); }
    catch (er) { signin(er.message); }
  };
}
function start() { refresh(); clearInterval(timer); timer = setInterval(refresh, 4000); }
const STATE = { NOT_STARTED: ["Not started", "grey"], WRITING: ["Writing", "warn"], NO_SIGNAL: ["No signal", "bad"], SUBMITTED: ["Submitted", ""] };
async function refresh() {
  let d; try { d = await call("/api/admin/state"); } catch (e) { if (e.status === 401) return signin("Your session ended. Type the passphrase again."); return; }
  const t = d.test, ex = d.exam, rows = d.rows.filter((r) => !filter || r.state === filter);
  const c = (s) => d.rows.filter((r) => r.state === s).length;
  const scores = d.rows.filter((r) => r.score != null).map((r) => r.score);
  $("#app").innerHTML = `<div class="wrap">
  <div class="row between"><div><h1>${esc(t.title)}</h1><div class="muted small">${d.questions} questions · ${t.durationMin}${ex.extraMin ? " + " + ex.extraMin : ""} minutes · status <b>${esc(ex.status.toLowerCase())}</b></div></div>
  <div class="row">${ex.status === "WAITING" ? `<button class="btn acc" data-a="start">Start exam</button>` : ""}
    ${ex.status === "LIVE" ? `<button class="btn sec" id="ext">Add time</button><button class="btn red" data-a="end" data-c="End the exam for everyone? Unsubmitted tests are submitted with their saved answers.">End exam</button>` : ""}
    <button class="btn" id="exp">Export results</button></div></div>
  <div class="card row between" style="margin-top:14px"><div><div class="small muted">Room code for the board</div><div class="code">${esc(ex.roomCode)}</div></div>
    <div><div class="small muted">Students open one of these on lab PCs:</div>${d.addresses.map((a) => `<div style="font:700 20px Consolas,monospace">${esc(a)}</div>`).join("") || "<div>No network found. Connect this PC to the lab switch.</div>"}
    <div class="row" style="margin-top:8px"><button class="btn sec sm" id="proj">Show on projector</button><button class="btn sec sm" data-a="newCode" data-c="Make a new room code?">New code</button></div></div></div>
  <div class="stats"><div class="stat">Expected<b>${d.rows.length}</b></div><div class="stat">Writing<b>${c("WRITING")}</b></div><div class="stat">No signal<b style="color:var(--bad)">${c("NO_SIGNAL")}</b></div><div class="stat">Submitted<b>${c("SUBMITTED")}</b></div><div class="stat">Average<b>${scores.length ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) + "%" : "n/a"}</b></div></div>
  <div class="card" style="margin-top:16px"><div class="row" style="margin-bottom:8px">${[["", "All"], ["WRITING", "Writing"], ["NO_SIGNAL", "No signal"], ["NOT_STARTED", "Not started"], ["SUBMITTED", "Submitted"]].map(([k, l]) => `<button class="btn sm ${filter === k ? "" : "sec"}" data-f="${k}">${l}</button>`).join("")}</div>
  <table><tr><th>Student</th><th>Status</th><th>Answered</th><th>Left window</th><th>Seat · PC</th><th>Score</th><th></th></tr>
  ${rows.map((r) => `<tr><td><b>${esc(r.name)}</b><div class="small muted">${esc(r.roll)} ${esc(r.section || "")}</div></td><td><span class="pill ${STATE[r.state][1]}">${STATE[r.state][0]}</span></td>
    <td>${r.state === "NOT_STARTED" ? "" : r.answered + " / " + r.total}</td><td>${r.tabSwitches || r.fullscreenExits ? `<b style="color:var(--bad)">${r.tabSwitches} tabs, ${r.fullscreenExits} full screen</b>` : ""}</td>
    <td class="small">${esc(r.seat)} ${esc(r.ip)}</td><td>${r.score == null ? "" : "<b>" + r.score + "%</b>"}</td>
    <td>${r.state === "WRITING" || r.state === "NO_SIGNAL" ? `<button class="btn sec sm" data-a="unlock" data-r="${esc(r.roll)}" data-c="Let ${esc(r.name)} sign in on another PC? Their answers are kept.">Move PC</button> <button class="btn sec sm" data-a="submitOne" data-r="${esc(r.roll)}" data-c="Submit ${esc(r.name)}'s test now?">Submit</button>` : ""}</td></tr>`).join("")}</table></div>
  <p class="small muted">Results are saved on this PC after every answer. If the PC restarts, run start-lab-server again and type the passphrase. Nothing is lost.</p></div>`;
  document.querySelectorAll("[data-a]").forEach((b) => b.onclick = async () => { if (b.dataset.c && !confirm(b.dataset.c)) return; try { await call("/api/admin/action", { action: b.dataset.a, roll: b.dataset.r }); refresh(); } catch (e) { alert(e.message); } });
  document.querySelectorAll("[data-f]").forEach((b) => b.onclick = () => { filter = b.dataset.f; refresh(); });
  const ext = $("#ext"); if (ext) ext.onclick = async () => { const m = prompt("Add how many minutes for everyone?", "10"); if (m) { await call("/api/admin/action", { action: "extend", minutes: Number(m) }); refresh(); } };
  $("#exp").onclick = async () => {
    if (ex.status !== "ENDED" && !confirm("The exam has not ended. Export what is saved so far?")) return;
    const r = await call("/api/admin/export"); const a = document.createElement("a"); a.href = URL.createObjectURL(await r.blob());
    a.download = t.title.replace(/[^a-z0-9]+/gi, "-").toLowerCase() + "-results.nsctresults"; a.click();
    alert("Results exported. A backup copy is also in the data folder. Upload this file on NSCT Ready under the lab test.");
  };
  $("#proj").onclick = () => { const b = $("#big"); b.innerHTML = `<div><div style="font-size:28px;opacity:.8">${esc(t.title)}</div><div style="font-size:22px;margin:16px 0">Open <b>${esc(d.addresses[0] || "")}</b> and enter:</div><div style="font:800 140px Consolas,monospace;letter-spacing:18px">${esc(ex.roomCode)}</div><div style="opacity:.6">Click to close</div></div>`; b.style.display = "grid"; b.onclick = () => b.style.display = "none"; };
}
token ? start() : signin();
</script>
</body>
</html>
