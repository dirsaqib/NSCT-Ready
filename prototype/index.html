<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NSCT Ready: Free NSCT 2027 Preparation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7F4; --card:#FFFFFF; --ink:#13201A; --muted:#5E6B64; --line:#E2E8E3;
  --brand:#0B6E4F; --brand-2:#0E8A63; --brand-soft:#E3F2EC; --accent:#E9A23B; --accent-soft:#FDF3E2;
  --good:#1E8E5A; --warn:#C98A12; --bad:#C2453A; --bad-soft:#FBEAE8; --info:#2F6FB3;
  --radius:14px; --shadow:0 1px 2px rgba(19,32,26,.06),0 4px 16px rgba(19,32,26,.05);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:#0A3D2E;color:#DDEBE4;padding:20px 14px;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.logo{display:flex;align-items:center;gap:10px;padding:4px 8px 18px}
.logo-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:#0A3D2E;font-weight:800;font-size:15px}
.logo b{font-size:17px;color:#fff;display:block;line-height:1.1}
.logo small{font-size:11px;color:#9CC3B2}
.nav-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#7FA595;padding:14px 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:9px;color:#DDEBE4;text-decoration:none;font-weight:500;font-size:14px}
.nav a:hover{background:rgba(255,255,255,.07)}
.nav a.on{background:rgba(233,162,59,.18);color:#fff}
.nav a .ic{width:18px;text-align:center;opacity:.9}
.side-foot{margin-top:auto;font-size:11px;color:#8DB0A1;padding:14px 8px 0;border-top:1px solid rgba(255,255,255,.08)}
main{padding:28px 32px 60px;max-width:1180px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:26px;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:18px;margin:0 0 12px}
h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--muted);margin:0}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.stat .v{font-size:28px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
.stat .d{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;background:var(--brand);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer;text-decoration:none;font-size:14px;white-space:nowrap}
.btn:hover{background:var(--brand-2)}
.btn.sec{background:#fff;color:var(--ink);border-color:var(--line)}
.btn.sec:hover{background:#F1F5F2}
.btn.acc{background:var(--accent);color:#2B1C02}
.btn.danger{background:var(--bad)}
.btn.ghost{background:transparent;color:var(--brand);border-color:transparent;padding:6px 8px}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--brand-soft);color:var(--brand)}
.pill.warn{background:var(--accent-soft);color:#8A5A0B}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.grey{background:#EEF1EF;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:13px}
.tiny{font-size:12px}
.hero{background:linear-gradient(135deg,#0B6E4F 0%,#0A3D2E 100%);color:#fff;border:0}
.hero .muted{color:#BFE0D2}
.count{display:flex;gap:10px}
.count div{background:rgba(255,255,255,.1);border-radius:10px;padding:8px 12px;text-align:center;min-width:62px}
.count b{display:block;font-size:22px}
.count span{font-size:11px;color:#BFE0D2;text-transform:uppercase;letter-spacing:.06em}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .lbl b{font-size:30px;display:block;line-height:1}
.ring .lbl span{font-size:11px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(150px,230px) 1fr 54px;gap:12px;align-items:center;font-size:13px}
.bar{height:10px;border-radius:99px;background:#EDF1EE;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}
.bar i.w{background:var(--accent)} .bar i.b{background:var(--bad)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
.tbl-wrap{overflow:auto}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
input[type=text],input[type=number],input[type=email],select,textarea{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-weight:400;width:100%}
textarea{min-height:80px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #9FD3BE;border-color:var(--brand)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;padding:10px 0}
.check input{margin-top:3px;width:17px;height:17px;accent-color:var(--brand)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}
.notice{border-left:4px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:8px;font-size:14px}
.notice.info{border-color:var(--info);background:#EAF2FB}
.notice.bad{border-color:var(--bad);background:var(--bad-soft)}
.heat td.c{text-align:center;font-weight:700;border-radius:6px}
pre.code{font-family:"JetBrains Mono",monospace;background:#0F1F18;color:#DDF5E9;padding:14px 16px;border-radius:10px;overflow:auto;font-size:13.5px;line-height:1.55;margin:12px 0}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;cursor:pointer;margin-bottom:10px;font-size:15px}
.opt:hover{border-color:#A9CDBE}
.opt .l{flex:none;width:28px;height:28px;border-radius:8px;background:#EEF3F0;display:grid;place-items:center;font-weight:700;font-size:13px}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .l{background:var(--brand);color:#fff}
.opt.ok{border-color:var(--good);background:#E6F5EC}
.opt.ok .l{background:var(--good);color:#fff}
.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.opt.no .l{background:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.exam{display:grid;grid-template-columns:1fr 280px;gap:18px;align-items:start}
.exam-bar{position:sticky;top:0;z-index:5;background:#0A3D2E;color:#fff;margin:-28px -32px 20px;padding:12px 32px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.timer{font-family:"JetBrains Mono",monospace;font-size:20px;font-weight:600;background:rgba(255,255,255,.1);padding:4px 12px;border-radius:8px}
.timer.low{background:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.pal button{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-size:12px;font-weight:700;cursor:pointer;position:relative}
.pal button.a{background:var(--brand);color:#fff;border-color:var(--brand)}
.pal button.f::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.pal button.cur{outline:2.5px solid var(--accent);outline-offset:1px}
.pal button.v:not(.a){background:#F3F5F4}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.qmeta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.qtext{font-size:17px;font-weight:600;margin:4px 0 8px}
.expl{background:#F4F8F6;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px;font-size:14px}
.ai-box{background:#F3F0FB;border:1px solid #DDD4F3;border-radius:12px;padding:14px;margin-top:10px;font-size:14px;white-space:pre-wrap}
.ai-box.loading{color:var(--muted)}
.modal-bg{position:fixed;inset:0;background:rgba(10,30,22,.45);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:16px;padding:24px;max-width:440px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#13201A;color:#fff;padding:11px 18px;border-radius:10px;font-size:14px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.25);max-width:90vw}
.chat{display:flex;flex-direction:column;gap:12px;max-height:56vh;overflow:auto;padding:4px}
.msg{max-width:82%;padding:11px 14px;border-radius:14px;font-size:14.5px;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--brand);color:#fff;border-bottom-right-radius:4px}
.msg.a{align-self:flex-start;background:#F1F4F2;border-bottom-left-radius:4px}
.week{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}
.week.now{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.week ul{margin:8px 0 0;padding-left:18px}
.week li{margin:3px 0;font-size:14px}
.badge{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:12px;border:1px dashed var(--line);text-align:center;font-size:12px;color:var(--muted)}
.badge .e{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#EEF1EF;font-weight:800;color:#9AA7A0}
.badge.on{border-style:solid;border-color:#F0D49F;background:var(--accent-soft);color:#6B4608}
.badge.on .e{background:var(--accent);color:#2B1C02}
.loading-screen{display:grid;place-items:center;min-height:70vh;text-align:center}
.spin{width:34px;height:34px;border:3px solid #CFE3D9;border-top-color:var(--brand);border-radius:50%;animation:sp 0.9s linear infinite;margin:0 auto 14px}
@keyframes sp{to{transform:rotate(360deg)}}
.hide{display:none!important}
.ringrow{flex-wrap:nowrap}
.tutorgrid{grid-template-columns:1fr 300px}
main.wide{max-width:none}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:16px;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:9px 12px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--brand);border-color:var(--brand)}
.qlist .q{border-bottom:1px solid var(--line);padding:12px 0}
.qlist .q:last-child{border-bottom:0}
footer.disc{margin-top:40px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:nowrap;overflow-x:auto;padding:10px;gap:4px;align-items:center}
  .logo{padding:0 10px 0 4px}
  .logo small,.nav-label,.side-foot{display:none}
  .nav{display:flex;gap:2px}
  .nav a{white-space:nowrap;padding:8px 10px}
  main{padding:20px 16px 50px}
  .g2,.g3,.g4{grid-template-columns:1fr}
  .exam{grid-template-columns:1fr}
  .exam-bar{margin:-20px -16px 16px;padding:10px 16px}
  .bar-row{grid-template-columns:120px 1fr 44px}
  .ringrow{flex-wrap:wrap}
  .tutorgrid{grid-template-columns:1fr}
}
@media (min-width:961px) and (max-width:1180px){.g4{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="logo"><div class="logo-mark">NR</div><div><b>NSCT Ready</b><small>Free prep for NSCT 2027</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">Independent and free. Not affiliated with HEC, VU, PSEB or P@SHA.</div>
  </aside>
  <main id="main"><div class="loading-screen"><div><div class="spin"></div><div class="muted">Loading NSCT Ready...</div></div></div></main>
</div>
<div id="layer"></div>
<script>
"use strict";
/* ---------- Constants ---------- */
const SUBJ=[
 {k:"PS",n:"Problem Solving & Analytical Skills",short:"Problem Solving",w:20},
 {k:"PROG",n:"Programming (C++/Java/Python)",short:"Programming",w:10},
 {k:"DSA",n:"Data Structures & Algorithms",short:"DSA",w:10},
 {k:"DB",n:"Databases",short:"Databases",w:10},
 {k:"SE",n:"Software Engineering",short:"Software Eng.",w:10},
 {k:"WEB",n:"Web Development",short:"Web Dev",w:10},
 {k:"AI",n:"AI/ML & Data Analytics",short:"AI/ML",w:10},
 {k:"NET",n:"Computer Networks & Cloud Computing",short:"Networks & Cloud",w:10},
 {k:"OS",n:"Operating Systems",short:"OS",w:5},
 {k:"SEC",n:"Cyber Security",short:"Cyber Security",w:5}];
const SK=SUBJ.map(s=>s.k);
const SN=Object.fromEntries(SUBJ.map(s=>[s.k,s]));
const TEST_DATE=new Date("2027-01-23T09:00:00+05:00");
const BP={
  diagnostic:{PS:4,PROG:2,DSA:2,DB:2,SE:2,WEB:2,AI:2,NET:2,OS:1,SEC:1},
  mock:{PS:12,PROG:6,DSA:6,DB:6,SE:6,WEB:6,AI:6,NET:6,OS:3,SEC:3}};
const DUR={diagnostic:25*60,mock:60*60};
const TYPE_LABEL={diagnostic:"Diagnostic",mock:"Full mock",practice:"Practice",mistakes:"Mistakes review",ai:"AI practice"};
const UNIS=["Air University, Islamabad","Air University, Multan Campus","Air University, Aerospace and Aviation Campus Kamra","Bahria University","COMSATS University Islamabad","FAST-NUCES","NUST","Quaid-i-Azam University","International Islamic University Islamabad","Riphah International University","Capital University of Science and Technology","SZABIST","Foundation University","NUML","PMAS Arid Agriculture University","UET Lahore","University of the Punjab","LUMS","Information Technology University","University of Management and Technology","University of Central Punjab","GC University Lahore","Lahore College for Women University","University of Lahore","Forman Christian College","Bahauddin Zakariya University","University of Agriculture Faisalabad","GC University Faisalabad","University of Sargodha","Islamia University of Bahawalpur","University of Gujrat","University of Karachi","NED University","IBA Karachi","Sir Syed University of Engineering and Technology","Mehran UET","University of Sindh","Sukkur IBA University","University of Peshawar","UET Peshawar","IMSciences Peshawar","Abdul Wali Khan University Mardan","Hazara University","University of Malakand","GIK Institute","University of Balochistan","BUITEMS Quetta","MUST Mirpur","University of Azad Jammu and Kashmir","Karakoram International University","Virtual University of Pakistan","Other"];
const PROGRAMS=["BS Computer Science","BS Software Engineering","BS Information Technology","BS Artificial Intelligence","BS Data Science","BS Cyber Security","BS Computer Games Development","BS Bioinformatics","Other computing program"];

/* ---------- State ---------- */
const S={db:null,user:null,sample:null,uid:null,admin:false,canWrite:null,profile:null,results:null,Q:[],qById:{},notices:[],chat:[],lang:"English",ready:false};
let E=null; // active exam/practice session

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const main=$("#main");
function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pct(c,t){return t?Math.round(100*c/t):0}
function todayStr(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function fmtDate(iso){if(!iso)return "Never";const d=new Date(iso);return d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})}
function fmtTime(s){s=Math.max(0,Math.round(s));const m=Math.floor(s/60),x=s%60;return m+":"+String(x).padStart(2,"0")}
function daysLeft(){return Math.max(0,Math.ceil((TEST_DATE-new Date())/86400000))}
function toast(msg,ms){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms||3200)}
function modal(title,body,okLabel,danger,cancelLabel){return new Promise(res=>{const L=$("#layer");L.innerHTML=`<div class="modal-bg"><div class="modal"><h2>${esc(title)}</h2><p class="muted">${esc(body)}</p><div class="row" style="justify-content:flex-end;margin-top:18px">${cancelLabel===null?"":`<button class="btn sec" id="m-no">${esc(cancelLabel||"Cancel")}</button>`}<button class="btn ${danger?"danger":""}" id="m-ok">${esc(okLabel||"OK")}</button></div></div></div>`;const done=v=>{L.innerHTML="";res(v)};const no=$("#m-no");if(no)no.onclick=()=>done(false);$("#m-ok").onclick=()=>done(true)})}
function copyText(txt){try{navigator.clipboard.writeText(txt).then(()=>toast("Copied to clipboard"),()=>showCopyBox(txt))}catch(e){showCopyBox(txt)}}
function showCopyBox(txt){const L=$("#layer");L.innerHTML=`<div class="modal-bg"><div class="modal" style="max-width:640px"><h2>Copy this text</h2><textarea style="min-height:240px;font-family:JetBrains Mono,monospace;font-size:12px">${esc(txt)}</textarea><div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn" id="m-ok">Close</button></div></div></div>`;$("#m-ok").onclick=()=>L.innerHTML=""}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout",message:"timed out"}),ms))])}
function emptyResults(){return {attempts:[],mastery:{},topics:{},wrong:[],streak:{last:null,days:0},points:0,bestMock:0,qs:{},ai:0,reports:[]}}
function bumpAi(){if(!S.profile||!S.results)return;S.results.ai=(S.results.ai||0)+1;saveResults()}
function band(score){if(score>=75)return {t:"Top performer range",c:"",d:"You are on track for the top band."};if(score>=60)return {t:"Likely to qualify",c:"",d:"Keep practising your weak subjects."};if(score>=45)return {t:"Borderline",c:"warn",d:"A focused plan can lift you into the qualifying range."};return {t:"At risk",c:"bad",d:"Start with your weakest high-weight subjects."}}
function readiness(r){r=r||S.results||emptyResults();let score=0,tested=0;for(const s of SUBJ){const m=r.mastery[s.k];if(m&&m.t>0){tested++;score+=s.w*(m.c/m.t)}}return {score:Math.round(score),tested}}
function subjAcc(r,k){const m=(r||S.results).mastery[k];return m&&m.t?m.c/m.t:null}
function lastOf(type){return (S.results.attempts||[]).find(a=>a.type===type)}

/* ---------- Data layer ---------- */
async function saveResults(){if(!S.db||!S.uid)return false;try{S.results.updated=new Date().toISOString();await S.db.doc("results/"+S.uid).set(S.results);return true}catch(e){toast(e&&e.code==="invalid_argument"?"Your progress could not be saved. Ask the owner for Contributor access.":"Could not save your progress. Please try again.");return false}}
async function saveProfile(p){await S.db.doc("profiles/"+S.uid).set(p);S.profile=p}
async function updateLeaderboard(){if(!S.profile||!S.profile.leaderboard)return;const rd=readiness();try{await S.db.doc("leaderboard/"+S.uid).set({alias:S.profile.alias||initials(S.profile.name),university:S.profile.university,best:S.results.bestMock||0,readiness:rd.score,updated:new Date().toISOString()})}catch(e){}}
async function removeLeaderboard(){try{await S.db.doc("leaderboard/"+S.uid).delete()}catch(e){}}
function initials(n){return String(n||"Student").split(/\s+/).filter(Boolean).map(w=>w[0].toUpperCase()).join("").slice(0,3)+"."}

/* ---------- Boot ---------- */
async function boot(){
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    S.db=db;S.user=user;
    claude.use("sample").then(s=>{S.sample=s;if(S.ready)route()}).catch(()=>{});
    if(!db){renderNoDb();return}
    S.uid=user?await user.id():null;
    S.admin=user?!!(await user.canEdit()):false;
    S.owner=user?!!(await user.isOwner()):false;
    S.canWrite=user?await user.can("data.write"):null;
    if(!S.uid){renderNoDb();return}
    const [p,r,q,n,ro]=await withTimeout(Promise.all([
      db.doc("profiles/"+S.uid).get(),
      db.doc("results/"+S.uid).get(),
      db.collection("questions").get(),
      db.collection("notices").get().catch(()=>({docs:[]})),

async function confirmSubmit(){
  const un=E.items.filter(x=>x.chosen==null).length,fl=E.items.filter(x=>x.flagged).length;
  if(E.practice){const unchecked=E.items.filter(x=>!x.checked).length;if(unchecked&&!(await modal("Finish practice?",`${unchecked} question(s) not checked yet. Unchecked questions are not counted.`,"Finish")))return;finishSession(false);return}
  if(await modal("Submit your test?",`${un} unanswered and ${fl} flagged question(s). You cannot change answers after submitting.`,"Submit"))finishSession(false);
}
function endSessionCleanup(){if(E&&E.timer)clearInterval(E.timer);document.removeEventListener("visibilitychange",onVis)}
async function finishSession(auto){
  if(!E||E.done)return;
  const it=curItem();it.time+=(Date.now()-E.qStart)/1000;
  E.done=true;endSessionCleanup();
  if(auto)toast("Time is up. Your test was submitted.");
  const items=E.practice?E.items.filter(x=>x.checked):E.items;
  const by={};let correct=0;
  for(const x of items){const ok=x.chosen===x.q.a;if(ok)correct++;const b=by[x.q.s]=by[x.q.s]||[0,0];b[1]++;if(ok)b[0]++}
  const timeSec=Math.round((Date.now()-E.startedAt)/1000);
  const score=pct(correct,items.length);
  E.result={type:E.type,label:E.label,date:new Date().toISOString(),total:items.length,correct,score,bySubject:by,timeSec,switches:E.switches};
  if(items.length){
    const r=S.results;
    r.attempts=[E.result].concat(r.attempts||[]).slice(0,40);
    for(const x of items){const ok=x.chosen===x.q.a;const m=r.mastery[x.q.s]=r.mastery[x.q.s]||{c:0,t:0};m.t++;if(ok)m.c++;
      const tk=x.q.s+"|"+(x.q.t||"General");const tp=r.topics[tk]=r.topics[tk]||[0,0];tp[1]++;if(ok)tp[0]++;
      if(S.qById[x.q.id]){r.wrong=(r.wrong||[]).filter(id=>id!==x.q.id);if(!ok)r.wrong.unshift(x.q.id);const qs=r.qs=r.qs||{};const z=qs[x.q.id]=qs[x.q.id]||[0,0];z[1]++;if(ok)z[0]++;}}
    r.wrong=(r.wrong||[]).slice(0,200);
    r.points=(r.points||0)+correct*10;
    const t=todayStr(),y=todayStr(new Date(Date.now()-86400000));r.streak=r.streak||{last:null,days:0};
    if(r.streak.last!==t){r.streak.days=r.streak.last===y?r.streak.days+1:1;r.streak.last=t}
    if(E.type==="mock"&&!E.label&&score>(r.bestMock||0))r.bestMock=score;
    await saveResults();
    if(E.type==="mock")updateLeaderboard();
  }
  go("report");
}

/* ---------- AI tutor ---------- */
function aiErr(e){if(e&&e.code==="rate_limited")return "The AI tutor is busy. Please try again in a minute.";if(e&&e.code==="not_granted")return "The AI tutor is not enabled for you on this page.";return "The AI tutor could not answer right now."}
function langLine(){return S.lang==="Urdu"?"Answer in Urdu, using Urdu script. Keep technical terms in English.":S.lang==="Roman Urdu"?"Answer in Roman Urdu (Urdu written in English letters). Keep technical terms in English.":"Answer in simple English."}
async function aiExplain(q,chosen,box){
  if(!S.sample||!box)return;bumpAi();box.className="ai-box loading";box.textContent="Thinking...";
  const prompt=`You are a friendly tutor helping a Pakistani computing student prepare for the NSCT exam. ${langLine()} In under 150 words, explain why the correct answer is right and why the student's choice is wrong. Give one short tip to avoid this mistake. Do not use markdown headings.

Subject: ${SN[q.s]?SN[q.s].n:q.s}. Topic: ${q.t}
Question: ${q.q}
${q.code?"Code:\n"+q.code+"\n":""}Options:
${q.o.map((o,i)=>"ABCD"[i]+") "+o).join("\n")}
Correct answer: ${"ABCD"[q.a]}) ${q.o[q.a]}
Student chose: ${chosen==null?"no answer":"ABCD"[chosen]+") "+q.o[chosen]}`;
  try{const res=await S.sample(prompt,{modelTier:"quick",onText:({text})=>{box.className="ai-box";box.textContent=text}});box.className="ai-box";box.textContent=res.text}catch(e){box.className="ai-box";box.textContent=aiErr(e)}
}
async function aiGenerate(subject,topic,count,difficulty){
  const prompt=`Write ${count} new multiple-choice questions for Pakistan's National Skills Competency Test (NSCT) for computing graduates.
Subject: ${SN[subject].n}${topic?". Topic: "+topic:""}. Difficulty: ${difficulty||"mixed"}.
Rules: each question has exactly 4 options and exactly one correct answer. Test applied understanding, not trivia. If a question uses code, put the code in "code" (Python, C++ or Java) and keep it under 12 lines. Explanations are 1 to 3 short sentences. Use plain English.
Return only JSON in this shape: {"questions":[{"q":"question text","code":"optional code or empty string","options":["A","B","C","D"],"answer":0,"explanation":"why","topic":"short topic name","difficulty":1}]}. "answer" is the 0-based index of the correct option. "difficulty" is 1, 2 or 3.`;
  const v=await S.sample.json(prompt,{modelTier:"default"});
  const arr=(v&&v.questions)||[];
  return arr.filter(x=>x&&typeof x.q==="string"&&Array.isArray(x.options)&&x.options.length===4&&x.options.every(o=>typeof o==="string")&&Number.isInteger(x.answer)&&x.answer>=0&&x.answer<4).map((x,i)=>({id:"gen-"+Date.now()+"-"+i,s:subject,t:(x.topic||topic||"General").slice(0,40),d:[1,2,3].includes(x.difficulty)?x.difficulty:2,q:x.q,code:x.code||"",o:x.options,a:x.answer,e:x.explanation||"",src:"ai-live"}));
}

/* ---------- Chart helpers (single hue, hover tooltips) ---------- */
function colChart(vals,labels,o){o=o||{};const W=640,H=o.h||160,pad=30,n=Math.max(1,vals.length),max=Math.max(1,...vals);const bw=(W-pad)/n;
  let s=`<svg viewBox="0 0 ${W} ${H+24}" width="100%" role="img" aria-label="${esc(o.aria||"chart")}" style="display:block">`;
  for(const f of [0.5,1]){const y=H-(H-12)*f;s+=`<line x1="${pad}" x2="${W}" y1="${y}" y2="${y}" stroke="#E8EDE9"/><text x="${pad-6}" y="${y+4}" text-anchor="end" font-size="10" fill="#5E6B64">${Math.round(max*f)}${o.suffix||""}</text>`}
  s+=`<line x1="${pad}" x2="${W}" y1="${H}" y2="${H}" stroke="#C9D3CC"/>`;
  const every=o.every||Math.ceil(n/8);
  vals.forEach((v,i)=>{const h=(H-12)*v/max,x=pad+i*bw;s+=`<g><title>${esc(labels[i])}: ${v}${o.suffix||""}</title><rect x="${x+1}" y="${H-h}" width="${Math.max(1,bw-2)}" height="${Math.max(0,h)}" rx="${Math.min(3,bw/4)}" fill="${o.color||"#0B6E4F"}"/><rect x="${x}" y="0" width="${bw}" height="${H}" fill="transparent"/></g>`;
    if(i%every===0)s+=`<text x="${x+bw/2}" y="${H+16}" text-anchor="middle" font-size="10" fill="#5E6B64">${esc(labels[i])}</text>`});
  return s+"</svg>"}
function hbars(rows,o){o=o||{};const max=o.max||Math.max(1,...rows.map(r=>r.v));return `<div class="bars">${rows.map(r=>{const p=Math.round(100*r.v/max);const cls=o.grade?(r.v>=70?"":r.v>=50?"w":"b"):"";return `<div class="bar-row" title="${esc(r.label)}: ${esc(r.text!=null?r.text:r.v)}"><div class="small"><b>${esc(r.label)}</b>${r.sub?` <span class="muted tiny">${esc(r.sub)}</span>`:""}</div><div class="bar"><i class="${cls}" style="width:${p}%"></i></div><div class="small" style="text-align:right">${esc(r.text!=null?r.text:r.v)}</div></div>`}).join("")}</div>`}
function heatColor(p){if(p==null)return "#F1F3F2";return p>=70?"#CDEBDB":p>=55?"#FBE7C4":"#F6D2CD"}
function tierOf(avg){return avg>=70?"Top tier":avg>=55?"Upper middle":avg>=40?"Lower middle":"Bottom tier"}
function csvCopy(head,rows){copyText([head.join(",")].concat(rows.map(r=>r.map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(","))).join("\n"))}
function aggSubjects(rows){const agg={};SK.forEach(k=>agg[k]=[0,0]);rows.forEach(x=>SK.forEach(k=>{const m=x.r.mastery&&x.r.mastery[k];if(m){agg[k][0]+=m.c;agg[k][1]+=m.t}}));return agg}
function aggTopics(rows){const t={};rows.forEach(x=>Object.entries(x.r.topics||{}).forEach(([k,[c,n]])=>{const z=t[k]=t[k]||{c:0,t:0,s:0};z.c+=c;z.t+=n;z.s++}));return Object.entries(t).map(([k,v])=>({k,sub:k.split("|")[0],topic:k.split("|")[1],p:pct(v.c,v.t),t:v.t,students:v.s}))}

/* ---------- Question forms shared by focal and super ---------- */
function questionForm(pre){pre=pre||{};return `<form id="af" class="grid" style="gap:12px;max-width:760px">${pre.replaces?`<div class="notice info">You are suggesting an improved version of question <b>${esc(pre.replaces)}</b>. The super admin will review it and replace the old one if approved.</div>`:""}<div class="grid g3"><label class="f">Subject<select name="s">${SUBJ.map(s=>`<option value="${s.k}" ${pre.s===s.k?"selected":""}>${esc(s.n)}</option>`).join("")}</select></label><label class="f">Topic<input type="text" name="t" required maxlength="40" value="${esc(pre.t||"")}"></label><label class="f">Difficulty<select name="d">${[1,2,3].map(d=>`<option value="${d}" ${(pre.d||2)===d?"selected":""}>${d} ${["Easy","Medium","Hard"][d-1]}</option>`).join("")}</select></label></div>
  <label class="f">Question<textarea name="q" required>${esc(pre.q||"")}</textarea></label><label class="f">Code (optional)<textarea name="code" style="font-family:JetBrains Mono,monospace">${esc(pre.code||"")}</textarea></label>
  <div class="grid g2">${[0,1,2,3].map(i=>`<label class="f">Option ${"ABCD"[i]}<input type="text" name="o${i}" required value="${esc((pre.o||[])[i]||"")}"></label>`).join("")}</div>
  <div class="grid g2"><label class="f">Correct option<select name="a">${[0,1,2,3].map(i=>`<option value="${i}" ${pre.a===i?"selected":""}>${"ABCD"[i]}</option>`).join("")}</select></label></div>
  <label class="f">Explanation<textarea name="e" required>${esc(pre.e||"")}</textarea></label><input type="hidden" name="replaces" value="${esc(pre.replaces||"")}"><div><button class="btn" type="submit">${S.role==="super"?"Add to bank (live)":"Send for review"}</button></div></form>`}
function readQuestionForm(f){return {s:f.get("s"),t:f.get("t").trim(),d:+f.get("d"),q:f.get("q").trim(),code:f.get("code"),o:[0,1,2,3].map(i=>f.get("o"+i).trim()),a:+f.get("a"),e:f.get("e").trim()}}
async function saveQuestion(q,extra){const id=(S.role==="super"?"q-":"c-")+Date.now()+"-"+Math.floor(Math.random()*1000);
  const doc=Object.assign({},q,{created:new Date().toISOString(),author:S.uid,authorUni:S.roleUni||"",status:S.role==="super"?"live":"review",src:S.role==="super"?"admin":"focal"},extra||{});
  await S.db.doc("questions/"+id).set(doc);const full=Object.assign({id},doc);S.Qall.push(full);S.qById[id]=full;if(full.status==="live")S.Q.push(full);return full}
function questionCard(q,actions){return `<div class="q"><div class="row between"><div class="qmeta" style="margin:0"><span class="pill grey">${esc(SN[q.s]?SN[q.s].short:q.s)}</span><span class="pill grey">${esc(q.t)}</span><span class="pill grey">Level ${q.d||2}</span><span class="pill ${q.src==="seed"?"":"warn"}">${esc(q.src||"seed")}</span>${q.authorUni?`<span class="pill grey">${esc(q.authorUni)}</span>`:""}${q.replaces?`<span class="pill">replaces ${esc(q.replaces)}</span>`:""}</div><div class="row">${actions||""}</div></div><div style="margin-top:6px"><b>${esc(q.q)}</b></div>${q.code?`<pre class="code">${esc(q.code)}</pre>`:""}<ol type="A" class="small" style="margin:6px 0">${q.o.map((o,i)=>`<li ${i===q.a?'style="color:var(--good);font-weight:700"':""}>${esc(o)}</li>`).join("")}</ol><div class="small muted">${esc(q.e)}</div></div>`}
function questionStats(rows){const st={};rows.forEach(x=>Object.entries(x.r.qs||{}).forEach(([id,[c,t]])=>{const z=st[id]=st[id]||{c:0,t:0};z.c+=c;z.t+=t}));const rep={};rows.forEach(x=>(x.r.reports||[]).forEach(r=>{(rep[r.qid]=rep[r.qid]||[]).push(r)}));return {st,rep}}
function aiDraftPanel(target,onSave){target.innerHTML=`<div class="grid g4" style="gap:12px;align-items:end"><label class="f">Subject<select id="gs">${SUBJ.map(s=>`<option value="${s.k}">${esc(s.n)}</option>`).join("")}</select></label><label class="f">Topic (optional)<input type="text" id="gt"></label><label class="f">How many<select id="gn"><option>3</option><option selected>5</option><option>8</option></select></label><button class="btn" id="gg">Generate drafts</button></div><p class="small muted">AI drafts must be checked by a subject expert.</p><div id="gout"></div>`;
  $("#gg").onclick=async()=>{const b=$("#gg");b.disabled=true;b.textContent="Generating...";const out=$("#gout");
    try{const pending=await aiGenerate($("#gs").value,$("#gt").value.trim(),+$("#gn").value,"mixed");
      out.innerHTML=pending.length?`<div class="qlist">${pending.map((q,i)=>`<div class="q"><label class="check" style="padding:0"><input type="checkbox" data-pi="${i}" checked><span style="flex:1">${questionCard(q)}</span></label></div>`).join("")}</div><button class="btn" id="gsave">${S.role==="super"?"Add selected to bank":"Send selected for review"}</button>`:`<div class="empty">No valid questions came back. Try again.</div>`;
      const sv=$("#gsave");if(sv)sv.onclick=async()=>{const pick=[...out.querySelectorAll("input[data-pi]:checked")].map(c=>pending[+c.dataset.pi]);let n=0;for(const q of pick){try{await onSave({s:q.s,t:q.t,d:q.d,q:q.q,code:q.code,o:q.o,a:q.a,e:q.e});n++}catch(e){}}toast(n+" question(s) saved");out.innerHTML=""}}
    catch(e){out.innerHTML=`<div class="notice bad">${esc(aiErr(e))}</div>`}finally{b.disabled=false;b.textContent="Generate drafts"}}}

/* ---------- Super: detailed analytics ---------- */
async function vAnalytics(){
  staffLoading("Analytics");
  let all;try{all=await loadAll(true)}catch(e){main.querySelector(".card").innerHTML=`<div class="empty">Data can't be loaded right now.</div>`;return}
  const rows=all.rows,DAY=86400000,now=Date.now();
  const active=rows.filter(x=>x.n>0);
  const attempts=rows.flatMap(x=>(x.r.attempts||[]).map(a=>Object.assign({},a,{uid:x.id,uni:x.p.university})));
  const last7=new Set(attempts.filter(a=>now-new Date(a.date)<7*DAY).map(a=>a.uid)).size;
  const answers=rows.reduce((s,x)=>s+SK.reduce((t,k)=>t+((x.r.mastery[k]||{}).t||0),0),0);
  const avg=active.length?Math.round(active.reduce((s,x)=>s+x.rd.score,0)/active.length):0;
  const aiCalls=rows.reduce((s,x)=>s+(x.r.ai||0),0);
  // time series, last 30 days
  const days=[...Array(30)].map((_,i)=>todayStr(new Date(now-(29-i)*DAY)));

/* ---------- HEC reports: build, publish, view ---------- */
function buildSnapshot(rows,minGroup){
  const c=rows.filter(x=>x.p.consentResearch!==false),act=c.filter(x=>x.n>0);
  const agg=aggSubjects(act);
  const topics=aggTopics(act).filter(t=>t.students>=minGroup&&t.t>=10).sort((a,b)=>a.p-b.p);
  let hidden=0;
  const group=key=>{const g={};c.forEach(x=>{const k=key(x)||"Not given";const z=g[k]=g[k]||{n:0,act:0,sum:0};z.n++;if(x.n){z.act++;z.sum+=x.rd.score}});
    return Object.entries(g).filter(([,z])=>{const ok=z.n>=minGroup;if(!ok)hidden++;return ok}).map(([k,z])=>({k,n:z.n,act:z.act,avg:z.act?Math.round(z.sum/z.act):null})).sort((a,b)=>(b.avg||0)-(a.avg||0))};
  const rbins=Array(10).fill(0);act.forEach(x=>rbins[Math.min(9,Math.floor(x.rd.score/10))]++);
  const attempts=act.flatMap(x=>x.r.attempts||[]);const mocks=attempts.filter(a=>a.type==="mock"&&!a.label);
  return {created:new Date().toISOString(),minGroup,students:c.length,active:act.length,universities:new Set(c.map(x=>x.p.university)).size,
    avgReadiness:act.length?Math.round(act.reduce((s,x)=>s+x.rd.score,0)/act.length):null,tests:attempts.length,mocks:mocks.length,avgMock:mocks.length?Math.round(mocks.reduce((s,a)=>s+a.score,0)/mocks.length):null,
    subjects:SUBJ.map(s=>({k:s.k,n:s.n,w:s.w,p:agg[s.k][1]?pct(agg[s.k][0],agg[s.k][1]):null})),
    weakTopics:topics.slice(0,12).map(t=>({s:t.sub,topic:t.topic,p:t.p})),strongTopics:topics.slice().reverse().slice(0,6).map(t=>({s:t.sub,topic:t.topic,p:t.p})),
    readinessBins:act.length>=minGroup?rbins:null,
    bands:act.length>=minGroup?[["Top performer range",act.filter(x=>x.rd.score>=75).length],["Likely to qualify",act.filter(x=>x.rd.score>=60&&x.rd.score<75).length],["Borderline",act.filter(x=>x.rd.score>=45&&x.rd.score<60).length],["At risk",act.filter(x=>x.rd.score<45).length]]:null,
    byProvince:group(x=>prov(x.p.university)),byProgram:group(x=>x.p.program),bySemester:group(x=>"Semester "+x.p.semester),byUniversity:group(x=>x.p.university),hiddenGroups:hidden}}
function renderSnapshot(s,history){
  const g=(t,list)=>`<div class="card"><h2>${esc(t)}</h2>${list.length?`<table><tr><th>Group</th><th>Students</th><th>Active</th><th>Avg readiness</th></tr>${list.map(x=>`<tr><td>${esc(x.k)}</td><td>${x.n}</td><td>${x.act}</td><td><b>${x.avg==null?"n/a":x.avg}</b></td></tr>`).join("")}</table>`:`<div class="empty">No group has ${s.minGroup} or more students yet.</div>`}</div>`;
  const trend=(history||[]).slice().reverse().filter(h=>h.avgReadiness!=null);
  return `<div class="notice info" style="margin-bottom:16px">Anonymised report. Only students who gave research consent are counted. No names or contact details. Any group with fewer than <b>${s.minGroup}</b> students is not shown${s.hiddenGroups?` (${s.hiddenGroups} small groups hidden)`:""}. Figures are platform estimates, not official NSCT results.</div>

function myStatus(){

  if(same&&v.status==="rejected")return "rejected";
  if(p.autoVerified&&p.autoVerified===rosterKey(p.university,p.roll))return "verified";

}

/* ---------- Test engine v2 ---------- */
function qType(q){return q.type||"single"}
function nOpts(q){return (q.o||[]).length}
makeItem=function(q){return {q,order:qType(q)==="code"?[]:shuffle([...Array(nOpts(q)).keys()]),chosen:qType(q)==="multi"?[]:null,code:q.starter||"",codePassed:0,codeTotal:0,codeOut:null,flagged:false,visited:false,time:0,checked:false}};
function hasAns(x){const t=qType(x.q);return t==="multi"?x.chosen.length>0:t==="code"?x.code.trim()!==(x.q.starter||"").trim():x.chosen!=null}
function credit(x){const q=x.q,t=qType(q);
  if(t==="multi"){const sel=x.chosen||[],m=q.m||[];const right=sel.filter(i=>m.includes(i)).length,wrong=sel.length-right;if(right===m.length&&!wrong)return 1;return S.cfg.partial?Math.max(0,(right-wrong)/m.length):0}
  if(t==="code")return x.codeTotal?x.codePassed/x.codeTotal:0;
  return x.chosen===q.a?1:0}
function isRight(x){return credit(x)>=0.999}

function runCode(q,code,all){return new Promise(res=>{const tests=(q.tests||[]).filter(t=>all||!t.hidden);if(!tests.length)return res({passed:0,total:0,rows:[]});
  const src=`${code}\nconst T=${JSON.stringify(tests)};const out=T.map(t=>{try{const got=${q.fn||"solve"}(...JSON.parse("["+t.in+"]"));return {ok:JSON.stringify(got)===JSON.stringify(JSON.parse(t.out)),got:JSON.stringify(got)}}catch(e){return {ok:false,got:"Error: "+e.message}}});postMessage(out);`;
  let w,done=false;const fin=r=>{if(done)return;done=true;try{w&&w.terminate()}catch(e){}res(r)};
  try{w=new Worker(URL.createObjectURL(new Blob([src],{type:"text/javascript"})));w.onmessage=e=>fin({passed:e.data.filter(x=>x.ok).length,total:tests.length,rows:e.data.map((x,i)=>Object.assign({},x,{in:tests[i].in,out:tests[i].out,hidden:tests[i].hidden}))});w.onerror=e=>{e.preventDefault();fin({passed:0,total:tests.length,rows:tests.map(t=>({ok:false,got:"Error: "+(e.message||"code did not run"),in:t.in,out:t.out,hidden:t.hidden}))})};setTimeout(()=>fin({passed:0,total:tests.length,rows:tests.map(t=>({ok:false,got:"Time limit (2 seconds) exceeded",in:t.in,out:t.out,hidden:t.hidden}))}),2000)}
  catch(e){fin({passed:0,total:tests.length,rows:[]})}})}

/* Proctoring: full screen, copy and paste blocked, watermark, autosave */
function blockEv(e){if(E&&!E.done&&!E.practice){e.preventDefault();if(e.type!=="contextmenu")toast("Copy and paste are turned off during tests.")}}
function onFs(){if(E&&!E.done&&!E.practice&&!document.fullscreenElement&&E.fsWas){E.fsExits++;E.fsWas=false;renderTest()}else if(document.fullscreenElement&&E)E.fsWas=true}
function startProctor(){["copy","cut","paste","contextmenu"].forEach(t=>document.addEventListener(t,blockEv));document.addEventListener("fullscreenchange",onFs);
  let wm=$("#wm");if(!wm){wm=document.createElement("div");wm.id="wm";document.body.appendChild(wm)}
  const label=esc((S.profile&&S.profile.name||"Student")+" · "+(S.profile&&S.profile.roll||"")+" · "+new Date().toLocaleDateString("en-GB"));
  wm.innerHTML=Array(40).fill(`<span>${label}</span>`).join("");wm.style.display="block";
  E.saveTimer=setInterval(saveSession,S.cfg.autosave*1000);heartbeat(true,true)}
function stopProctor(){["copy","cut","paste","contextmenu"].forEach(t=>document.removeEventListener(t,blockEv));document.removeEventListener("fullscreenchange",onFs);const wm=$("#wm");if(wm)wm.style.display="none";
  if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{})}
function goFull(){try{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.then)p.then(()=>{if(E)E.fsWas=true;renderTest()}).catch(()=>{if(E)E.fsBlocked=true;renderTest()})}catch(e){if(E)E.fsBlocked=true}}
function saveSession(){if(!E||E.done||E.practice)return;E.lastSaved=Date.now();ls("nr_session_"+S.uid,{type:E.type,label:E.label,windowId:E.windowId,timed:E.timed,endAt:E.endAt,startedAt:E.startedAt,switches:E.switches,fsExits:E.fsExits,idx:E.idx,
  items:E.items.map(x=>({id:S.qById[x.q.id]?x.q.id:null,q:S.qById[x.q.id]?null:x.q,order:x.order,chosen:x.chosen,code:x.code,flagged:x.flagged,time:x.time}))});const s=$("#saved");if(s)s.textContent="Saved "+new Date().toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function resumeSession(){const z=ls("nr_session_"+S.uid);if(!z)return false;
  E={type:z.type,label:z.label,windowId:z.windowId,items:z.items.map(it=>Object.assign(makeItem(it.id?S.qById[it.id]:it.q),{order:it.order,chosen:it.chosen,code:it.code,flagged:it.flagged,time:it.time})).filter(x=>x.q),idx:z.idx||0,timed:z.timed,endAt:z.endAt,startedAt:z.startedAt,qStart:Date.now(),switches:z.switches||0,fsExits:z.fsExits||0,done:false,practice:false,timer:null};
  if(E.timed){if(E.endAt<=Date.now()){go("test");finishSession(true);return true}E.timer=setInterval(tick,500)}
  document.addEventListener("visibilitychange",onVis);startProctor();go("test");return true}

startSession=function(type,qs,opts){
  opts=opts||{};
  if(!qs.length){modal("No questions available","The question bank has no questions for this selection yet. Try another subject.","OK",false,null);return}
  const extra=(S.verify&&S.verify.extraPct)||0;const dur=opts.duration?Math.round(opts.duration*(1+extra/100)):0;
  E={type,items:qs.map(makeItem),idx:0,timed:!!dur,endAt:dur?Date.now()+dur*1000:null,startedAt:Date.now(),qStart:Date.now(),switches:0,fsExits:0,done:false,practice:!!opts.practice,label:opts.label||"",windowId:opts.windowId||null,timer:null,extra};
  if(E.timed)E.timer=setInterval(tick,500);
  document.addEventListener("visibilitychange",onVis);
  if(!E.practice){startProctor();goFull()}
  go("test");
};
endSessionCleanup=function(){if(E&&E.timer)clearInterval(E.timer);if(E&&E.saveTimer)clearInterval(E.saveTimer);document.removeEventListener("visibilitychange",onVis);stopProctor()};

renderTest=function(){
  if(!E)return go("home");
  const it=curItem(),q=it.q,t=qType(q);it.visited=true;
  const answered=E.items.filter(hasAns).length;const showAns=E.practice&&it.checked;const L="ABCDEF";

    <div class="row" style="margin-top:8px"><button class="btn sm sec" id="run">Run sample tests</button><span class="small muted">${(q.tests||[]).filter(x=>x.hidden).length} hidden tests are run when you submit.</span></div>
    ${it.codeOut?`<div class="tbl-wrap" style="margin-top:8px"><table><tr><th>Input</th><th>Expected</th><th>Your output</th><th></th></tr>${it.codeOut.rows.filter(r=>!r.hidden||showAns).map(r=>`<tr><td><code>${esc(r.in)}</code></td><td><code>${esc(r.out)}</code></td><td><code>${esc(r.got)}</code></td><td>${r.ok?`<span class="pill">pass</span>`:`<span class="pill bad">fail</span>`}</td></tr>`).join("")}</table></div>`:""}`}
  else body=(t==="multi"?`<p class="small"><b>Select all that apply.</b>${S.cfg.partial?" Partial marks are given.":""}</p>`:"")+it.order.map((oi,pos)=>{const sel=t==="multi"?it.chosen.includes(oi):it.chosen===oi;const right=t==="multi"?(q.m||[]).includes(oi):oi===q.a;let cls="";if(showAns){if(right)cls="ok";else if(sel)cls="no"}else if(sel)cls="sel";
    return `<button class="opt ${cls}" data-oi="${oi}" ${showAns?"disabled":""} aria-pressed="${sel}"><span class="l">${t==="multi"?(sel?"☑":"☐"):L[pos]}</span><span>${esc(q.o[oi])}</span></button>`}).join("");
  const proct=!E.practice&&E.timed;
  main.innerHTML=`<div class="exam-bar"><div><b>${esc(TYPE_LABEL[E.type]||"Test")}</b>${E.label?` · ${esc(E.label)}`:""} <span style="opacity:.75" class="small">· ${answered}/${E.items.length} answered</span>${E.extra?` <span class="pill warn">+${E.extra}% time</span>`:""}</div><div class="row">${proct?`<span class="tiny" id="saved" style="opacity:.75"></span>`:""}${E.timed?`<span class="timer" id="timer">${fmtTime((E.endAt-Date.now())/1000)}</span>`:""}<button class="btn sm sec" id="exit">Exit</button><button class="btn sm acc" id="submit">${E.practice?"Finish":"Submit test"}</button></div></div>
  ${proct&&!document.fullscreenElement&&!E.fsBlocked?`<div class="notice" style="margin-bottom:12px">This test runs in full screen. <button class="btn sm" id="fs">Enter full screen</button>${E.fsExits?` Full-screen exits recorded: ${E.fsExits}.`:""}</div>`:""}
  <div class="exam"><div class="card">
    <div class="qmeta"><span class="pill">Question ${E.idx+1} of ${E.items.length}</span><span class="pill grey">${esc(SN[q.s]?SN[q.s].short:q.s)}</span><span class="pill grey">${esc(q.t||"")}</span>${t!=="single"?`<span class="pill warn">${t==="multi"?"Multi-select":t==="scenario"?"Scenario":"Coding"}</span>`:""}${q.src==="ai-live"?`<span class="pill warn">AI generated</span>`:""}</div>
    ${q.sc?`<div class="card flat" style="background:var(--accent-soft);margin-bottom:12px"><b>${esc(q.scTitle||"Scenario")}</b><div class="small" style="white-space:pre-wrap">${esc(q.sc)}</div></div>`:""}
    <div class="qtext">${esc(q.q)}</div>${q.code?`<pre class="code">${esc(q.code)}</pre>`:""}
    <div style="margin-top:14px">${body}</div>
    ${showAns?`<div class="expl"><b>${isRight(it)?"Correct.":credit(it)>0?"Partly correct.":"Not quite."}</b> ${esc(q.e||"")}</div>${!isRight(it)&&S.sample&&t!=="code"?`<div class="row" style="margin-top:8px"><button class="btn sm sec" id="aiexp">Explain my mistake with AI</button><select id="lang" style="width:auto">${["English","Urdu","Roman Urdu"].map(l=>`<option ${S.lang===l?"selected":""}>${l}</option>`).join("")}</select></div><div id="aibox"></div>`:""}`:""}
    <div class="row between" style="margin-top:16px"><div class="row"><button class="btn sec sm" id="prev" ${E.idx===0?"disabled":""}>Previous</button><button class="btn ghost sm" id="bm">${bm?"★ Bookmarked":"☆ Bookmark"}</button>${E.practice?"":`<button class="btn sec sm" id="flag">${it.flagged?"Unflag":"Flag for review"}</button><button class="btn ghost sm" id="clear">Clear answer</button>`}</div>
    ${E.practice&&!it.checked?`<button class="btn" id="check" ${hasAns(it)?"":"disabled"}>Check answer</button>`:`<button class="btn" id="next">${E.idx===E.items.length-1?(E.practice?"Finish":"Review and submit"):"Next"}</button>`}</div>
  </div>
  <div class="card"><h3>Question palette</h3><div class="pal">${E.items.map((x,i)=>`<button data-i="${i}" class="${hasAns(x)?"a":""} ${x.flagged?"f":""} ${i===E.idx?"cur":""} ${x.visited?"v":""}">${i+1}</button>`).join("")}</div>
  <div class="legend"><span><i style="background:var(--brand)"></i>Answered</span><span><i style="background:#F3F5F4;border:1px solid var(--line)"></i>Seen</span><span><i style="background:var(--accent);border-radius:50%"></i>Flagged</span></div>
  ${proct?`<p class="tiny muted" style="margin:14px 0 0">Recorded: ${E.switches} tab switches, ${E.fsExits} full-screen exits. Answers save automatically.</p>`:""}</div></div>`;
  main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(E.practice&&it.checked)return;const oi=+b.dataset.oi;if(t==="multi"){it.chosen=it.chosen.includes(oi)?it.chosen.filter(z=>z!==oi):it.chosen.concat(oi)}else it.chosen=oi;renderTest()});

  const ce=$("#code");if(ce){ce.oninput=()=>{it.code=ce.value;const ck=$("#check");if(ck)ck.disabled=!hasAns(it)};ce.onkeydown=e=>{if(e.key==="Tab"){e.preventDefault();const s=ce.selectionStart;ce.value=ce.value.slice(0,s)+"  "+ce.value.slice(ce.selectionEnd);ce.selectionStart=ce.selectionEnd=s+2;it.code=ce.value}}}

  on("flag",()=>{it.flagged=!it.flagged;renderTest()});
  on("clear",()=>{it.chosen=t==="multi"?[]:null;if(t==="code")it.code=q.starter||"";renderTest()});

  on("next",()=>{saveCode();if(E.idx===E.items.length-1)confirmSubmit();else moveTo(E.idx+1)});
  on("submit",()=>{saveCode();confirmSubmit()});
  on("exit",async()=>{if(await modal("Exit without saving?","Your answers in this session will be lost.","Exit",true)){endSessionCleanup();ls("nr_session_"+S.uid,null);E=null;go(HOME[S.role])}});
  on("aiexp",()=>{S.lang=$("#lang").value;aiExplain(q,t==="multi"?it.chosen[0]:it.chosen,$("#aibox"))});

};
confirmSubmit=async function(){
  const un=E.items.filter(x=>!hasAns(x)).length,fl=E.items.filter(x=>x.flagged).length;
  if(E.practice){const unchecked=E.items.filter(x=>!x.checked).length;if(unchecked&&!(await modal("Finish practice?",`${unchecked} question(s) not checked yet. Unchecked questions are not counted.`,"Finish")))return;finishSession(false);return}
  if(await modal("Submit your test?",`${un} unanswered and ${fl} flagged question(s). You cannot change answers after submitting.`,"Submit"))finishSession(false);
};
finishSession=async function(auto){
  if(!E||E.done)return;
  const it=curItem();it.time+=(Date.now()-E.qStart)/1000;
  E.done=true;endSessionCleanup();ls("nr_session_"+S.uid,null);
  if(auto)toast("Time is up. Your test was submitted.");
  for(const x of E.items)if(qType(x.q)==="code"&&!E.practice){const r=await runCode(x.q,x.code,true);x.codePassed=r.passed;x.codeTotal=r.total;x.codeOut=r}
  const items=E.practice?E.items.filter(x=>x.checked):E.items;
  const by={};let raw=0,correct=0,neg=0;
  for(const x of items){const c=credit(x);raw+=c;if(c>=0.999)correct++;else if(hasAns(x)&&qType(x.q)==="single"&&!E.practice)neg+=S.cfg.negMark;const b=by[x.q.s]=by[x.q.s]||[0,0];b[1]++;if(c>=0.999)b[0]++}
  const timeSec=Math.round((Date.now()-E.startedAt)/1000);
  const score=items.length?Math.max(0,Math.round(100*(raw-neg)/items.length)):0;
  const flags=[];if(!E.practice&&E.timed){if(score>=80&&timeSec<items.length*S.cfg.fastSec)flags.push("Very fast, high score");if(E.switches>S.cfg.maxTabs)flags.push("Tab switching");if(E.fsExits>1)flags.push("Left full screen")}

function authorName(){return S.role==="student"?(S.profile&&(S.profile.alias||initials(S.profile.name))):((ROLE_LABEL[S.subrole||S.role]||"Staff")+(S.roleUni?" · "+S.roleUni:""))}

/* ---------- Focal: verification queue and bulk upload ---------- */
const _loadAll=loadAll;
loadAll=async function(force){const all=await _loadAll(force);
  if(!all._ver||force){const [v,st]=await Promise.all([getCol("verify"),Promise.resolve(null)]);all.ver=Object.fromEntries(v.map(x=>[x.id,x]));all._ver=true}
  if(S.subrole&&S.scope){const keep=x=>x.p.university===S.roleUni&&(!S.scope.campus||x.p.campus===S.scope.campus)&&(!S.scope.department||x.p.department===S.scope.department);return Object.assign({},all,{rows:all.rows.filter(keep)})}
  return all};
function stOf(x,all){const v=all.ver[x.id],p=x.p;if(v&&v.status==="blocked")return "blocked";const same=v&&v.roll===p.roll&&v.uni===p.university;if(same&&v.status==="verified")return "verified";if(same&&v.status==="rejected")return "rejected";if(p.autoVerified&&p.autoVerified===rosterKey(p.university,p.roll))return "verified";return "pending"}
vStudents=async function(){
  staffLoading("Students and verification");
  if(S.role!=="super"&&!S.roleUni){main.innerHTML=`<div class="notice bad">Your role is not linked to a university yet.</div>`;return}
  let all;try{all=await loadAll(true)}catch(e){main.querySelector(".card").innerHTML=`<div class="empty">Can't load students right now.</div>`;return}
  if(!S.admin){main.innerHTML=`<div class="top"><div><h1>Students</h1></div></div>`+needEditor();return}
  const rows=all.rows.filter(x=>S.role==="super"||x.p.university===S.roleUni);
  let tab="pending",q="",open=null;
  const dupes=new Set();const seen={};rows.forEach(x=>{const k=(x.p.university+"|"+x.p.roll).toLowerCase();if(seen[k]){dupes.add(seen[k]);dupes.add(x.id)}else seen[k]=x.id});
  const setV=async(x,data)=>{const v=Object.assign({},all.ver[x.id]||{},{roll:x.p.roll,uni:x.p.university,at:new Date().toISOString(),by:S.uid},data);try{await put("verify/"+x.id,v);all.ver[x.id]=v;logAudit("student."+(data.status||"edit"),x.id);draw()}catch(e){toast("Could not save. You need Editor access.")}};
  const draw=()=>{const counts={pending:0,verified:0,rejected:0,blocked:0};rows.forEach(x=>counts[stOf(x,all)]++);
    const list=rows.filter(x=>(tab==="all"||stOf(x,all)===tab)&&(!q||(x.p.name+" "+x.p.roll+" "+x.p.program).toLowerCase().includes(q)));
    main.innerHTML=`<div class="top"><div><h1>Students and verification</h1><p class="sub">${esc(S.roleUni||"All universities")}${S.scope&&S.scope.campus?" · "+esc(S.scope.campus):""}${S.scope&&S.scope.department?" · "+esc(S.scope.department):""} · ${rows.length} registered</p></div><button class="btn sec" id="csv">Copy CSV</button></div>
    <div class="card" style="margin-bottom:16px"><h3 style="margin-top:0">Bulk upload your batch</h3><p class="small muted" style="margin-top:0">CSV with columns full_name, roll_number, program, campus, department, section. A Moodle export (firstname, lastname, idnumber) also works. Students on the list are verified the moment they register.</p>
      <div class="row"><input type="file" id="up" accept=".csv,text/csv">${S.role==="super"?`<select id="upu" style="width:auto">${UNIS.map(u=>`<option>${esc(u)}</option>`).join("")}</select>`:""}<button class="btn sm" id="upb">Upload</button></div><div id="upr" class="small" style="margin-top:6px"></div></div>
    <div class="card"><div class="tabs">${[["pending","Waiting"],["verified","Verified"],["rejected","Asked to fix"],["blocked","Deactivated"],["all","All"]].map(([k,l])=>`<button class="${tab===k?"on":""}" data-t="${k}">${l} (${k==="all"?rows.length:counts[k]})</button>`).join("")}</div>
    <input type="text" id="q" placeholder="Search name, roll number or program" value="${esc(q)}" style="max-width:320px;margin:10px 0">

      <td><div class="row">${s!=="verified"&&s!=="blocked"?`<button class="btn sm" data-v="${esc(x.id)}">Verify</button>`:""}${s==="pending"?`<button class="btn sm sec" data-r="${esc(x.id)}">Ask to fix</button>`:""}<button class="btn sm ghost" data-x="${esc(x.id)}">Extra time</button>${s==="blocked"?`<button class="btn sm ghost" data-a="${esc(x.id)}">Activate</button>`:`<button class="btn sm ghost" data-b="${esc(x.id)}">Deactivate</button>`}</div></td></tr>`}).join("")}</table></div>${list.length?"":`<div class="empty">Nobody here.</div>`}</div><div id="detail">${open?userDetail(open,all.roles[open.id]):""}</div>${foot()}`;
    main.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()});
    const qi=$("#q");qi.oninput=e=>{q=e.target.value.toLowerCase();const pos=e.target.selectionStart;draw();const n=$("#q");n.focus();n.setSelectionRange(pos,pos)};
    const find=id=>rows.find(x=>x.id===id);
    main.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>setV(find(b.dataset.v),{status:"verified",reason:""}));
    main.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{const f=await ask("Ask the student to fix details",`<label class="f">What should they correct?<textarea name="reason" required maxlength="300" placeholder="e.g. Roll number does not match our records"></textarea></label>`,"Send");if(f)setV(find(b.dataset.r),{status:"rejected",reason:String(f.get("reason"))})});

    main.querySelectorAll("[data-b]").forEach(b=>b.onclick=async()=>{if(await modal("Deactivate this student?","They can sign in but cannot take tests.","Deactivate",true))setV(find(b.dataset.b),{status:"blocked"})});

    $("#upb").onclick=async()=>{const file=$("#up").files[0];if(!file){toast("Choose a CSV file");return}const uni=S.role==="super"?$("#upu").value:S.roleUni;
      const text=await file.text();const lines=text.split(/\r?\n/).filter(l=>l.trim());const split=l=>{const o=[];let cur="",inq=false;for(const ch of l){if(ch==='"')inq=!inq;else if(ch===","&&!inq){o.push(cur);cur=""}else cur+=ch}o.push(cur);return o.map(s=>s.trim())};
      const head=split(lines[0]).map(h=>h.toLowerCase());const col=n=>head.indexOf(n);let ok=0,bad=[];
      for(let i=1;i<lines.length;i++){const c=split(lines[i]);const roll=c[col("roll_number")]||c[col("idnumber")]||"";const name=c[col("full_name")]||[c[col("firstname")],c[col("lastname")]].filter(Boolean).join(" ");
        if(!roll||!name){bad.push(i+1);continue}try{await put("roster/"+rosterKey(uni,roll),{uni,program:c[col("program")]||"",campus:c[col("campus")]||"",department:c[col("department")]||"",section:c[col("section")]||"",by:S.uid,at:new Date().toISOString()});ok++}catch(e){bad.push(i+1)}}

  };
  draw();
};

/* Duplicate check on question save */
const _saveQ=saveQuestion;
saveQuestion=async function(q,extra){const words=s=>new Set(String(s).toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>2));const a=words(q.q);
  const sim=S.Qall.filter(x=>x.s===q.s).map(x=>{const b=words(x.q);const i=[...a].filter(w=>b.has(w)).length;return {x,j:i/Math.max(1,new Set([...a,...b]).size)}}).filter(z=>z.j>=0.6).sort((p,r)=>r.j-p.j);
  if(sim.length&&!(await modal("A similar question exists",`"${sim[0].x.q.slice(0,140)}" is ${Math.round(sim[0].j*100)}% similar. Save yours anyway?`,"Save anyway")))throw new Error("cancelled");
  const r=await _saveQ(q,Object.assign({version:1},extra||{}));logAudit("question.create",r.id);return r};

    <div class="grid g2"><label class="f">Role<select id="rr">${RO.map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select></label><label class="f">University<select id="ru"><option value="">Select</option>${UNIS.map(u=>`<option>${esc(u)}</option>`).join("")}</select></label></div>
    <div class="grid g2"><label class="f">Campus (campus admin, HOD)<select id="rc"></select></label><label class="f">Department (HOD)<select id="rd"></select></label></div>
    <div class="grid g2"><label class="f">Sponsor<select id="rs"><option value="">None</option>${(S.cfg.sponsors||[]).map(s=>`<option>${esc(s.name)}</option>`).join("")}</select></label><label class="f">Employer name<input id="re" placeholder="Company"></label></div>
    <button class="btn" id="ra" disabled>Save role</button></div></div>
  <div class="card flat" style="background:var(--brand-soft);border-color:#CBE5D9"><h2>Share level each role needs</h2><table><tr><th>Panel</th><th>Share level</th></tr><tr><td>Student, employer, sponsor, HEC</td><td><b>Contributor</b></td></tr><tr><td>Focal, campus admin, HOD, faculty</td><td><b>Editor</b></td></tr></table><p class="small muted">Staff sign in through claude.ai, which handles their two-factor sign-in.</p></div></div>
  <div class="card"><h2>Current roles</h2>${ids.length?`<table><tr><th>Person</th><th>Role</th><th>Scope</th><th>Since</th><th></th></tr>${ids.map(id=>{const r=roles[id];return `<tr><td><b>${esc(nm(id))}</b></td><td><span class="pill">${esc(ROLE_LABEL[r.role]||r.role)}</span></td><td class="small">${esc([r.university,r.campus,r.department,r.sponsor,r.employer].filter(Boolean).join(" · "))}</td><td>${fmtDate(r.assignedAt)}</td><td><button class="btn ghost sm" data-rm="${esc(id)}">Remove</button></td></tr>`}).join("")}</table>`:`<div class="empty">No staff roles yet.</div>`}</div>${foot()}`;
  const fillC=()=>{const s=structFor($("#ru").value);$("#rc").innerHTML=`<option value="">Whole university</option>`+s.map(c=>`<option>${esc(c.campus)}</option>`).join("");fillD()};
  const fillD=()=>{const c=structFor($("#ru").value).find(x=>x.campus===$("#rc").value);$("#rd").innerHTML=`<option value="">Whole campus</option>`+(c?c.depts.map(d=>`<option>${esc(d)}</option>`).join(""):"")};
  $("#ru").onchange=fillC;$("#rc").onchange=fillD;fillC();
  let pick=null;const hits=$("#hits");
  const search=async v=>{if(!S.user.search){hits.innerHTML=`<div class="notice bad">People search is not available here.</div>`;return}try{const res=await S.user.search(v);const list=(res&&res.hits)||res||[];hits.innerHTML=list.slice(0,8).map(h=>`<button class="btn sec sm" data-pid="${esc(h.id)}" style="margin:0 6px 6px 0">${esc(h.name||h.email||"Person")}</button>`).join("")||`<div class="small muted">No one found.</div>`;
    hits.querySelectorAll("[data-pid]").forEach(b=>b.onclick=()=>{pick={id:b.dataset.pid};hits.querySelectorAll("button").forEach(z=>z.classList.add("sec"));b.classList.remove("sec");$("#ra").disabled=false})}catch(e){hits.innerHTML=`<div class="small muted">Search failed.</div>`}};
  let t=null;$("#ps").onfocus=()=>search($("#ps").value);$("#ps").oninput=e=>{clearTimeout(t);t=setTimeout(()=>search(e.target.value),250)};
  $("#ra").onclick=async()=>{if(!pick)return;const role=$("#rr").value,u=$("#ru").value,c=$("#rc").value,d=$("#rd").value;
    if(["focal","campus","hod","faculty"].includes(role)&&!u){toast("Choose the university");return}if(role==="campus"&&!c){toast("Choose the campus");return}if(role==="hod"&&(!c||!d)){toast("Choose the campus and department");return}if(role==="sponsor"&&!$("#rs").value){toast("Choose the sponsor");return}
    try{if(role==="student")await S.db.doc("roles/"+pick.id).delete();else await S.db.doc("roles/"+pick.id).set({role,university:["focal","campus","hod","faculty"].includes(role)?u:"",campus:["campus","hod"].includes(role)?c:"",department:role==="hod"?d:"",sponsor:role==="sponsor"?$("#rs").value:"",employer:role==="employer"?$("#re").value.trim():"",assignedAt:new Date().toISOString(),by:S.uid});logAudit("role.assign",pick.id+" "+role);toast("Role saved. Set their share level too.");ALL=null;vRoles()}catch(e){toast("Could not save role")}};
  main.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{if(!(await modal("Remove this role?","They will see the student panel next time.","Remove",true)))return;try{await S.db.doc("roles/"+b.dataset.rm).delete();vRoles()}catch(e){toast("Could not remove")}});
};

document.head.insertAdjacentHTML("beforeend",`<style>
#wm{position:fixed;inset:0;pointer-events:none;z-index:40;display:none;overflow:hidden;opacity:.06;transform:rotate(-24deg) scale(1.4);font-size:14px;line-height:70px;color:#000}
#wm span{display:inline-block;margin:0 60px;white-space:nowrap}
.opt[aria-pressed="true"] .l{background:var(--brand);color:#fff}
[dir="rtl"] .bar-row,[dir="rtl"] .row{direction:rtl}
[dir="rtl"] body{font-family:"Noto Nastaliq Urdu","Plus Jakarta Sans",sans-serif}
details summary{cursor:pointer}
</style>`);

boot();

</script>
</body>
</html>
